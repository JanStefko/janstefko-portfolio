<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web je dočasně nedostupný</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 600px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(32px, 6vw, 56px);
        }

        p {
            margin: 0;
            color: #bdbdbd;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main>
        <h1>Web je dočasně nedostupný</h1>
        <p>Na webu právě probíhají úpravy. Brzy bude opět spuštěn.</p>
    </main>
</body>
</html>
